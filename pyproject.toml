[project]
name = "operational-coding-twin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "captum>=0.9.0",
    "datasets>=5.0.1",
    "huggingface-hub>=1.28.0",
    "joblib>=1.5.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "streamlit>=1.62.0",
    "torch>=2.13.0",
    "transformers>=5.16.1",
]

[project.scripts]
operational-coding-twin = "operational_coding_twin:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
